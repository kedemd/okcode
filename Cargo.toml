[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
# okdb is NOT a build dependency: okcode talks to the installed @kedem/okdb through its stable C bridge
# (okcode-okdb dlopens it; Node library mode takes the host's bridge table).

# Dev/test loop: dependencies optimised, our code incremental; no LTO anywhere but `dist`
# (okdb's measured lesson: LTO in the test loop kills incremental and dominates build time).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = false
codegen-units = 16

# Shipped binaries only: cargo build --profile dist
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
