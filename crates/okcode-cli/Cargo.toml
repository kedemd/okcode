[package]
name = "okcode-cli"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

# The standalone `okcode` binary (no Node): the commands of bin/okcode.js on okcode-core.
[[bin]]
name = "okcode"
path = "src/main.rs"

[dependencies]
okcode-core = { path = "../okcode-core" }
serde_json = { version = "1", features = ["preserve_order"] }
