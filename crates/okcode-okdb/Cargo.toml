[package]
name = "okcode-okdb"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

# okcode's client of okdb's stable C bridge (okdb_bridge.h, ABI 1): dlopen okdb's installed .node, no okdb crates in the
# build. The header is vendored in include/ for reference; ffi.rs mirrors it.
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
libloading = "0.8"
