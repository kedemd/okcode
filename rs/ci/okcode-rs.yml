# Release plan C6. Copy to .github/workflows/okcode-rs.yml to enable (the user's call; nothing here runs until then).
# CI for the Rust okcode: unit tests and goldens, the JS suite against the native addon (linux-x64),
# dist-profile builds of the addon + standalone CLI for every target in rs/packaging/targets.json, the per-platform npm
# package layout (rs/packaging/gen-packages.js) with `npm pack --dry-run`, and a release job that is OFF unless both a manual
# dispatch asks for it and the repo variable OKCODE_RELEASE is 'true'.
#
name: okcode-rs

on:
    push:
        branches: [master, rust-port]
        paths: ['rs/**', 'src/**', 'bin/**', 'test/**', 'grammars/**', 'package.json', '.github/workflows/okcode-rs.yml']
    pull_request:
        paths: ['rs/**', 'src/**', 'bin/**', 'test/**', 'grammars/**', 'package.json', '.github/workflows/okcode-rs.yml']
    workflow_dispatch:
        inputs:
            release:
                description: 'Run the release job (publishes @kedem/okcode-* and @kedem/okcode; needs repo variable OKCODE_RELEASE=true)'
                type: boolean
                default: false

concurrency:
    group: okcode-rs-${{ github.ref }}
    cancel-in-progress: true

env:
    # rs/.cargo/config.toml points target-dir at the dev machine's cache: CI builds in-tree
    CARGO_TARGET_DIR: ${{ github.workspace }}/rs/target
    CARGO_BUILD_JOBS: '4'
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: '0'
    NODE_VERSION: '24'

jobs:
    # ── 1. Rust unit tests + the JS goldens (rs/golden) ─────────────────────────────────────────────
    rust:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with: { workspaces: rs }
            - run: cd rs && cargo test --workspace --exclude okcode-node --exclude size-probe --exclude speed-probe

    # ── 2. the JS suite against the native addon, as shipped (linux-x64) ─────────────────────────────
    suite:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: '${{ env.NODE_VERSION }}' }
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with: { workspaces: rs }
            - run: npm ci
            - run: cd rs && cargo build --release -p okcode-node -p okcode-cli
            - name: JS suite (native)
              env:
                  OKCODE_NATIVE_BINARY: ${{ github.workspace }}/rs/target/release/okcode-node.node
                  OKCODE_CLI_BIN: ${{ github.workspace }}/rs/target/release/okcode
              run: |
                  cp rs/target/release/libokcode_node.so rs/target/release/okcode-node.node
                  node --test --test-force-exit test/*.test.js
                  node rs/golden/cli-diff.js rs/target/release/okcode

    # ── 3. dist builds per target ───────────────────────────────────────────────────────────────
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { key: linux-x64, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu, lib: libokcode_node.so, exe: okcode }
                    - { key: linux-arm64, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, lib: libokcode_node.so, exe: okcode }
                    - { key: linux-x64-musl, runner: ubuntu-24.04, rust: x86_64-unknown-linux-musl, lib: libokcode_node.so, exe: okcode, musl: true }
                    - { key: linux-arm64-musl, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl, lib: libokcode_node.so, exe: okcode, musl: true }
                    - { key: darwin-x64, runner: macos-13, rust: x86_64-apple-darwin, lib: libokcode_node.dylib, exe: okcode }
                    - { key: darwin-arm64, runner: macos-14, rust: aarch64-apple-darwin, lib: libokcode_node.dylib, exe: okcode }
                    - { key: win32-x64, runner: windows-2022, rust: x86_64-pc-windows-msvc, lib: okcode_node.dll, exe: okcode.exe }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with: { targets: '${{ matrix.rust }}' }
            - uses: Swatinem/rust-cache@v2
              with: { workspaces: rs, key: '${{ matrix.key }}' }
            - if: matrix.musl
              run: sudo apt-get update && sudo apt-get install -y musl-tools
            - name: cargo build --profile dist
              shell: bash
              run: |
                  cd rs
                  # a musl cdylib needs crt-static off (Node loads it dynamically)
                  if [ "${{ matrix.musl }}" = "true" ]; then export RUSTFLAGS="-C target-feature=-crt-static"; fi
                  cargo build --profile dist --target ${{ matrix.rust }} -p okcode-node -p okcode-cli
            - uses: actions/upload-artifact@v4
              with:
                  name: okcode-${{ matrix.key }}
                  path: |
                      rs/target/${{ matrix.rust }}/dist/${{ matrix.lib }}
                      rs/target/${{ matrix.rust }}/dist/${{ matrix.exe }}
                  if-no-files-found: error

    # ── 4. per-platform packages + npm pack dry-runs ─────────────────────────────────────────────
    package:
        needs: [build]
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: '${{ env.NODE_VERSION }}' }
            - uses: actions/download-artifact@v4
              with: { path: artifacts }
            - name: lay out @kedem/okcode-<key>
              shell: bash
              run: |
                  V=$(node -p "require('./package.json').version")
                  for d in artifacts/okcode-*; do
                      key=${d#artifacts/okcode-}
                      lib=$(ls $d/*okcode_node.* | head -1); exe=$(ls $d/okcode $d/okcode.exe 2>/dev/null | head -1)
                      node rs/packaging/gen-packages.js --out pkgs --version "$V" --key "$key" --addon "$lib" --cli "$exe"
                  done
                  for p in pkgs/*; do (cd $p && npm pack --dry-run); done
                  npm pack --dry-run
            - uses: actions/upload-artifact@v4
              with: { name: okcode-packages, path: pkgs }

    # ── 5. release: OFF unless dispatched with release=true AND vars.OKCODE_RELEASE == 'true' ────────────
    release:
        if: github.event_name == 'workflow_dispatch' && inputs.release && vars.OKCODE_RELEASE == 'true'
        needs: [rust, suite, package]
        runs-on: ubuntu-24.04
        environment: release
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: '${{ env.NODE_VERSION }}', registry-url: 'https://registry.npmjs.org' }
            - uses: actions/download-artifact@v4
              with: { name: okcode-packages, path: pkgs }
            - name: publish platform packages, then the main package with their optionalDependencies
              env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
              run: |
                  V=$(node -p "require('./package.json').version")
                  for p in pkgs/*; do (cd $p && npm publish --access public); done
                  node -e "const f='package.json',p=require('./'+f),o=JSON.parse(require('child_process').execSync('node rs/packaging/gen-packages.js --main --version $V'));p.optionalDependencies=o.optionalDependencies;require('fs').writeFileSync(f,JSON.stringify(p,null,4)+'\n')"
                  npm publish --access public
