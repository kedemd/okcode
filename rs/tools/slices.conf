# Wave 3 slices: key | owned files (repo-relative; a .rs file also owns the same-named directory for
# submodules, e.g. tools.rs + tools/*.rs) | JS test files run natively for it | extra env for its
# tests. Sourced by rs/tools/integrate.sh. Architect-owned.
#
# Wave 2 (scan lookup grep library edit graph store okdb) is merged into rust-port; its branches
# are done. `regress` is a pseudo-slice (no branch, no files): the wave 2 tests no wave 3 slice
# runs, without gate flags — `integrate.sh --only api,tools,perf,regress` checks for regressions.
SLICES=(api tools perf)
# Thin JS wrappers in $N/js/src/<rel> (mapped over src/<rel> by
# preload-native.js with OKCODE_NATIVE_SRC=1) over okcode_core::pure. Run with --only pure-text,…
C1_SLICES=(pure-text pure-parse pure-ts pure-misc access)
declare -A SLICE_FILES SLICE_TESTS SLICE_ENV
C=rs/okcode-core/src
N=rs/okcode-node
SLICE_FILES[api]="$C/okcode.rs $N/src/okcode.rs $N/js/okcode.js"
SLICE_FILES[tools]="$C/tools.rs $N/src/tools.rs $N/js/tools.js"
SLICE_FILES[perf]="$C/workspace/scan.rs $C/store.rs $C/db.rs $N/src/store.rs $N/js/store.js"
SLICE_FILES[regress]=""
SLICE_TESTS[api]="test/okcode.test.js test/okcode-license.test.js test/okcode-identity.test.js test/okcode-embedders.test.js test/okcode-embedder-reopen.test.js test/okcode-passive.test.js test/okcode-passive-profile.test.js test/okcode-fts-mode.test.js test/analyzer-version.test.js test/unindexed.test.js"
SLICE_TESTS[tools]="test/tools.test.js test/workspace-library.test.js test/workspace-grep.test.js test/workspace-listing.test.js test/okcode-identity.test.js"
SLICE_TESTS[perf]="test/workspace-freshness.test.js test/workspace-memory.test.js test/odd-filenames.test.js test/store.test.js test/store-embeddings.test.js test/okcode-fts-mode.test.js"
SLICE_TESTS[regress]="test/workspace.test.js test/paging.test.js test/workspace-treesitter.test.js test/jsx.test.js test/decorators.test.js test/workspace-okjs.test.js test/workspace-commit.test.js test/edges.test.js test/cli.test.js"
# The gate flags of rs/okcode-node/preload-native.js: a slice's tests run with its own port mapped in.
SLICE_ENV[api]="OKCODE_NATIVE_API=1"
SLICE_ENV[tools]="OKCODE_NATIVE_TOOLS=1"
SLICE_ENV[perf]=""
SLICE_ENV[regress]=""
# For every test run: a bounded parse pool on this shared machine (workspace/scan.rs reads it).
COMMON_ENV="OKCODE_PARSE_THREADS=2"

# ── C1/C2 ──
NS=$N/js/src
ALLON="OKCODE_NATIVE_SRC=1 OKCODE_NATIVE_API=1 OKCODE_NATIVE_TOOLS=1"
SLICE_FILES[pure-text]="$C/pure/text.rs $NS/analysis/text.js $NS/analysis/chunk.js $NS/analysis/template-balance.js $NS/analysis/convention-color.js rs/okcode-text rs/okcode-chunk"
SLICE_FILES[pure-parse]="$C/pure/parse.rs $NS/analysis/parse.js $NS/analysis/extensions.js $NS/analysis/ext-okjs.js $NS/analysis/packages.js $NS/analysis/index.js rs/okcode-analysis rs/okcode-js rs/okcode-okjs rs/okcode-edges"
SLICE_FILES[pure-ts]="$C/pure/ts.rs $NS/analysis/treesitter.js $NS/analysis/validate.js rs/okcode-treesitter"
SLICE_FILES[pure-misc]="$C/pure/misc.rs $NS/grep.js $NS/identity.js $NS/edges.js $NS/embedders.js rs/okcode-grep rs/okcode-embed"
SLICE_FILES[access]="$C/pure/access.rs $NS/access $N/src/access_api.rs rs/okcode-access"
SLICE_TESTS[pure-text]="test/analysis-text.test.js test/chunk.test.js test/analysis-template-balance.test.js test/analysis-convention-color.test.js test/unindexed.test.js"
SLICE_TESTS[pure-parse]="test/analysis-parse.test.js test/analysis-packages.test.js test/analysis-okjs.test.js test/analyzer-version.test.js"
SLICE_TESTS[pure-ts]="test/analysis-treesitter.test.js test/analysis-validate.test.js test/jsx.test.js test/decorators.test.js test/workspace-treesitter.test.js test/edges.test.js"
SLICE_TESTS[pure-misc]="test/workspace-grep.test.js test/okcode-identity.test.js test/okcode-embedders.test.js test/okcode.test.js test/store-embeddings.test.js test/okcode-passive.test.js test/okcode-passive-profile.test.js"
SLICE_TESTS[access]="test/access-contract.test.js test/access-shell.test.js test/odd-filenames.test.js test/workspace-commit.test.js test/store.test.js test/paging.test.js test/tools.test.js"
for k in "${C1_SLICES[@]}"; do SLICE_ENV[$k]="$ALLON"; done
